# The files of the repository agentcurfew/agentcurfew.github.io, which serves https://agentcurfew.github.io/.
# Once a day, on a push and on demand, it builds the documentation site from the latest release tag of
# DevXord/agentcurfew (or from main before the first release) with `npm run site`, and deploys it to GitHub Pages.
# Nothing here is secret: the build reads a public repository and deploys with the run's own token.
name: pages

on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NPM: npx --yes npm@11.21.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Find the latest release
        id: release
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/DevXord/agentcurfew.git 'v*' | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 | sed 's#.*refs/tags/##')
          echo "ref=${tag:-main}" >> "$GITHUB_OUTPUT"
          echo "Building the site of ${tag:-main}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: DevXord/agentcurfew
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: $NPM ci --ignore-scripts --no-audit --no-fund
      - run: $NPM run site -- _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
